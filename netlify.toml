# Netlify Configuration
# Pre-rendered HTML files are committed directly to the repo
# No build step needed — just serve the static files

[build]
  publish = "."

# Redirect rules — order matters!
# Netlify serves real files first (e.g., /articles/slug/index.html)
# Only unmatched routes fall back to the SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"